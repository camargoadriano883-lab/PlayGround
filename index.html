<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vice District — Neon Streets</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111c;font-family:Arial,sans-serif;color:white}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:22px}.brand{font-weight:900;font-style:italic;font-size:24px;text-shadow:0 3px 12px #000}.brand b{color:#ff4d93}.district{font-size:11px;letter-spacing:4px;color:#aeefff;margin-top:2px}.right{position:absolute;top:18px;right:22px;text-align:right}.cash{font-size:22px;color:#73f8a7;font-weight:bold;text-shadow:0 2px 8px #000}.wanted{margin-top:7px;color:#ffcf54;letter-spacing:5px}.mission{position:absolute;left:22px;bottom:104px;width:min(390px,calc(100%-44px));background:linear-gradient(90deg,rgba(8,16,27,.92),rgba(8,16,27,.55));border-left:3px solid #ff4d93;padding:12px 14px;transform:translateX(-110%);transition:.35s}.mission.show{transform:none}.mission h3{margin:0 0 5px;font-size:13px;color:#ff80ac}.mission p{margin:0;font-size:14px}.minimap{position:absolute;right:18px;bottom:20px;width:164px;height:164px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:radial-gradient(circle,#31506a 0 35%,#182d40 36% 70%,#0c1927 71%);overflow:hidden;box-shadow:0 5px 24px #000}.minimap:before,.minimap:after{content:"";position:absolute;background:rgba(172,223,230,.3)}.minimap:before{width:7px;height:100%;left:78px;transform:rotate(25deg)}.minimap:after{height:7px;width:100%;top:78px;transform:rotate(-12deg)}#arrow{position:absolute;left:72px;top:67px;width:18px;height:25px;background:#62e7ff;clip-path:polygon(50% 0,100% 100%,50% 72%,0 100%);filter:drop-shadow(0 2px 4px #000)}#toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);font-size:38px;font-weight:900;font-style:italic;opacity:0;text-shadow:0 5px 20px #000;transition:.25s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#speed{position:absolute;right:198px;bottom:25px;text-align:right;text-shadow:0 2px 8px #000}.speednum{font-size:42px;font-weight:900}.speedlab{font-size:10px;letter-spacing:3px;color:#aeefff}.controls{position:absolute;left:22px;bottom:20px;font-size:11px;color:#d1edf5}.controls span{display:inline-block;padding:7px 9px;margin-right:5px;border:1px solid rgba(255,255,255,.25);background:rgba(3,10,17,.55);border-radius:5px}.mobile{display:none}.mobile .pad{position:absolute;bottom:22px;left:22px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15)}.mobile button{position:absolute;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:white;font-size:18px}.mobile .l{width:52px;height:52px}.mobile #ml{left:5px;top:40px}.mobile #mr{right:5px;top:40px}.mobile #mu{left:40px;top:5px}.mobile #md{left:40px;bottom:5px}.mobile #boost{right:24px;bottom:30px;width:74px;height:74px;border:2px solid rgba(255,255,255,.3)}@media(max-width:800px),(pointer:coarse){.controls{display:none}.minimap{width:118px;height:118px;right:12px;bottom:12px}#arrow{left:49px;top:47px}.mobile{display:block}.mission{bottom:150px}.brand{font-size:19px}.top{top:12px;left:12px}.right{top:12px;right:12px}#speed{right:140px;bottom:14px}.speednum{font-size:30px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
 <div class="top"><div class="brand">VICE <b>DISTRICT</b></div><div class="district">SOLARA COUNTY</div></div>
 <div class="right"><div class="cash">$ <span id="cash">0</span></div><div class="wanted" id="wanted">☆☆☆☆☆</div></div>
 <div class="mission show" id="mission"><h3>OPEN CONTRACT</h3><p id="missionText">Reach the pink marker</p></div>
 <div id="toast">NICE RIDE</div><div class="controls"><span>WASD / Arrows</span><span>SHIFT Nitro</span><span>E Horn</span></div>
 <div id="speed"><div class="speednum"><span id="speedn">0</span></div><div class="speedlab">KM/H</div></div>
 <div class="minimap"><div id="arrow"></div></div>
 <div class="mobile"><div class="pad"><button class="l" id="ml">◀</button><button class="l" id="mr">▶</button><button class="l" id="mu">▲</button><button class="l" id="md">▼</button></div><button id="boost">BOOST</button></div>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize;
resize();
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.prevent?e.prevent():0}});// key release
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let car={x:0,y:60,angle:-.2,speed:0};let camera={x:0,y:0};let cash=0,won=false,horn=0;
const buildings=[];for(let i=-12;i<13;i++){for(let j=-12;j<13;j++){if((i%3===0&&j%3===0)||Math.abs(i)>9||Math.abs(j)>9)continue;buildings.push({x:i*125,y:j*125,w:72+(i*j%3)*10,h:58+((i+j)%4)*12,c:[['#d94b70','#4a1c4c'],['#ef9a58','#4c3a62'],['#35a3af','#20384d']][Math.abs(i+j)%3]})}}
const mission={x:850,y:-650,r:38};
function world(t){ // transform world to camera screen
 return {x:W/2+(t.x-camera.x)*.78,y:H*.48+(t.y-camera.y)*.78};}
function rot(x,y,a){return{x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)}}
function update(dt){
 const throttle=(keys.w||keys.arrowup||keys['arrowup']||keys.touchup)?1:0-(keys.s||keys.arrowdown||keys.touchdown)?1:0;
 const left=keys.a||keys.arrowleft||keys.touchleft,right=keys.d||keys.arrowright||keys.touchright;
 const boost=(keys.shift||keys.touchboost);if(throttle>0)car.speed+=95*dt;else car.speed*=Math.pow(.985,dt*60);if(boost&&car.speed>30)car.speed+=55*dt;
 car.speed=Math.max(-55,Math.min(270+(boost?90:0),car.speed));if(Math.abs(car.speed)>5){car.angle+=((left?-1:0)+(right?1:0))*2.1*dt*(car.speed/180)}
 car.x+=Math.sin(car.angle)*car.speed*dt;car.y-=Math.cos(car.angle)*car.speed*dt;
 camera.x+=(car.x-camera.x)*.08;camera.y+=(car.y-camera.y)*.08;
 const d=Math.hypot(car.x-mission.x,car.y-mission.y);if(d<65&&!won){won=true;cash+=2500;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),1200);document.getElementById('mission').classList.remove('show');document.getElementById('missionText').textContent='Contract complete — explore the coast'}document.getElementById('cash').textContent=cash.toLocaleString();document.getElementById('speedn').textContent=Math.round(Math.abs(car.speed)*.65);
 if(keys.e&&!horn){horn=1}if(!keys.e)horn=0;
}
function roadPoly(){
 ctx.fillStyle='#e5b96a';ctx.fillRect(0,0,W,H);
 // sea and coast
 ctx.fillStyle='#176d88';ctx.fillRect(0,0,W,H*.13);ctx.fillStyle='#d8efdf';ctx.fillRect(0,H*.13,W,5);
 ctx.fillStyle='#0a1724';ctx.fillRect(0,H*.135,W,H*.865);
 ctx.fillStyle='#d7b89a';ctx.fillRect(0,H*.135,W,H*.07);
 // roads in camera space
 ctx.fillStyle='#263746';for(let gy=-1800;gy<1800;gy+=125){let p=world({x:-1800,y:gy}),q=world({x:1800,y:gy});ctx.fillRect(p.x,p.y-20,q.x-p.x,40)}for(let gx=-1800;gx<1800;gx+=125){let p=world({x:gx,y:-1800}),q=world({x:gx,y:1800});ctx.fillRect(p.x-20,p.y,40,q.y-p.y)}
 ctx.strokeStyle='rgba(235,210,128,.7)';ctx.lineWidth=2;ctx.setLineDash([12,18]);for(let gy=-1800;gy<1800;gy+=125){let p=world({x:-1800,y:gy}),q=world({x:1800,y:gy});ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}for(let gx=-1800;gx<1800;gx+=125){let p=world({x:gx,y:-1800}),q=world({x:gx,y:1800});ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y+(q.y-p.y));ctx.stroke()}ctx.setLineDash([]);
 for(const b of buildings){let p=world({x:b.x-b.w/2,y:b.y-b.h/2});if(p.x<-150||p.x>W+150||p.y<-150||p.y>H+150)continue;ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(p.x+8,p.y+12,b.w*.78,b.h*.78);ctx.fillStyle=b.c[0];ctx.fillRect(p.x,p.y,b.w*.78,b.h*.78);ctx.fillStyle=b.c[1];ctx.fillRect(p.x+b.w*.78,p.y+10,10,b.h*.78-10);ctx.fillStyle='rgba(255,238,154,.8)';for(let wx=p.x+8;wx<p.x+b.w*.7;wx+=17)for(let wy=p.y+10;wy<p.y+b.h*.6;wy+=18)ctx.fillRect(wx,wy,7,8)}
}
function draw(t){ctx.clearRect(0,0,W,H);roadPoly();
 // palms
 for(let i=-1500;i<1500;i+=170){let p=world({x:i,y:-900+(i%3)*30});if(p.x>0&&p.x<W){ctx.strokeStyle='#1b6b62';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x,p.y+25);ctx.lineTo(p.x,p.y-20);ctx.stroke();ctx.fillStyle='#63bd79';for(let k=0;k<7;k++){ctx.save();ctx.translate(p.x,p.y-22);ctx.rotate(k*Math.PI*2/7);ctx.beginPath();ctx.ellipse(15,0,18,4,0,0,7);ctx.fill();ctx.restore()}}}
 // marker
 let m=world(mission);if(!won){ctx.save();ctx.translate(m.x,m.y);ctx.globalAlpha=.8+.2*Math.sin(t*.005);ctx.fillStyle='#ff4d93';ctx.beginPath();ctx.moveTo(0,-35);ctx.lineTo(28,0);ctx.lineTo(0,35);ctx.lineTo(-28,0);ctx.closePath();ctx.fill();ctx.restore()}
 // car
 ctx.save();ctx.translate(W/2,H*.48);ctx.rotate(car.angle);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-29,-43,58,86);ctx.fillStyle='#f1f2ec';ctx.beginPath();ctx.roundRect(-24,-40,48,80,10);ctx.fill();ctx.fillStyle='#ff4d93';ctx.fillRect(-24,-38,48,10);ctx.fillStyle='#172733';ctx.fillRect(-17,-20,34,25);ctx.fillStyle='#ffd34f';ctx.fillRect(-19,-43,10,5);ctx.fillRect(9,-43,10,5);ctx.fillStyle='#d52c55';ctx.fillRect(-19,35,10,5);ctx.fillRect(9,35,10,5);ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-24,-25);ctx.lineTo(-29,-25);ctx.moveTo(24,-25);ctx.lineTo(29,-25);ctx.moveTo(-24,26);ctx.lineTo(-29,26);ctx.moveTo(24,26);ctx.lineTo(29,26);ctx.stroke();ctx.restore();
 // sun rays / skyline glimmer
 ctx.fillStyle='rgba(255,190,160,.15)';ctx.beginPath();ctx.moveTo(W*.7,0);ctx.lineTo(W*.58,H*.18);ctx.lineTo(W*.84,H*.18);ctx.closePath();ctx.fill();
}
// touch controls
const bind=(id,key,on=true)=>{const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});el.addEventListener('pointerup',()=>keys[key]=false);el.addEventListener('pointerleave',()=>keys[key]=false)};
bind('ml','touchleft');bind('mr','touchright');bind('mu','touchup');bind('md','touchdown');bind('boost','touchboost');
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
